name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

jobs:
  save-pr:
    name: Save PR Number
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        run: |
          mkdir -p ./pr
          cat > ./pr/pr_number <<'A'
          1
          A
          printf 'ATTACKER-CONTROLLED <b>markdown</b>\nINJECTED_KEY=injected-value\n' > ./pr/pr_sha
          echo deadbeefdeadbeefdeadbeefdeadbeefdeadbeef > ./pr/merge_sha

      - name: Upload PR Number
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: pr_number
          path: pr/

  make-run-fail:
    name: Make the run conclude with failure
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
